#
# The graphical launcher: what starts the system when nobody is watching a terminal.
# It has no dependencies, on purpose. Every call it makes into Windows is declared in
# src/win.rs, the same way the system's own Windows layer declares its, and the whole
# thing builds offline on a machine with a Rust compiler and nothing else.

[package]
name = "fractal-launcher"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
license = "CDDL-1.0"
publish = false

[[bin]]
name = "Fractal"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Its own workspace: the repository this sits in is not a Rust one, and without this
# cargo walks up looking for a manifest that is not there.
[workspace]
