# Builds the system, runs its own checks, and builds a release out of the same tree.
#
# Windows only, because the system is written against Windows APIs through
# java.lang.foreign: it opens named pipes, reads window lists and talks to the shell.
# A Linux runner would compile most of it and could not run any of it, which is a worse
# answer than not running.
name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install a JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        shell: bash
        run: sh tools/build.sh

      - name: Check
        shell: bash
        # The desktop is built offscreen and drawn into an image, never shown, so this
        # runs on a machine with no screen attached to it.
        run: |
          java --enable-preview --enable-native-access=ALL-UNNAMED \
               -Dorg.fractalmicro.images="$PWD/build/frameworks" \
               -cp build/FractalJDE.jar org.fractalmicro.Main --install
          java --enable-preview --enable-native-access=ALL-UNNAMED \
               -Dorg.fractalmicro.images="$PWD/build/frameworks" \
               -jar build/FractalJDE.jar --selftest | tee selftest.txt
          # Every count has to be zero, not one of them. Asking whether the words appear
          # anywhere passes a run where one suite failed and another did not.
          if grep -q "^FAIL" selftest.txt; then
              echo "checks failed:"
              grep "^FAIL" selftest.txt
              exit 1
          fi
          grep -q "0 failed" selftest.txt

      - name: Build the launcher
        shell: bash
        # The boot screen, which is the other half of what the system says while it comes
        # up and is the only part of this written in another language. Built before the
        # release rather than inside it, so that a launcher that will not compile is a
        # failed step here and not a quiet line in a log.
        run: sh tools/launcher.sh

      - name: Build a release
        shell: bash
        # The same thing anybody gets by running this: a kernel and a base image. It is
        # built on every push rather than only on a tag, because a release path exercised
        # once a version is a release path that is broken most of the time.
        run: sh tools/release.sh | tee release.txt

      - name: Check the release installs and starts
        shell: bash
        timeout-minutes: 5
        # Onto an empty directory that is not this machine's own volume, which is the only
        # way to find out whether what shipped can lay itself out somewhere it has never
        # been. Then all the way up: the kernel unpacks, reads the loader off the volume it
        # just wrote, starts launchd, launchd starts the session, and the session draws the
        # desktop into a file without showing it. A picture at the end of that is the whole
        # path having worked, which no amount of looking at the files can tell you.
        run: |
          version=$(sed -n 's/^version=//p' version.properties)
          java --enable-preview --enable-native-access=ALL-UNNAMED \
               -Dorg.fractalmicro.volume="$PWD/build/fresh" \
               -cp "build/FractalJDE-$version/FractalJDE.jar" org.fractalmicro.Kernel \
               --screenshot "$PWD/build/fresh-desktop.png" 2>&1 | tee boot.txt
          grep -q "files written" boot.txt
          grep -q "launchd: starting, as task 1" boot.txt
          # And that the session ran from the volume it was booted onto, rather than from
          # whatever is installed at home. It used to say it was doing the first and then
          # quietly do the second, which made this whole step a check of the machine it
          # was running on.
          grep -q "loginwindow: the volume is .*build.fresh" boot.txt
          test -f build/fresh/usr/lib/dyld
          test -f build/fresh/sbin/launchd
          test -s build/fresh-desktop.png

      - name: Draw the desktop for the README
        shell: bash
        timeout-minutes: 5
        # Taken here rather than on somebody's own machine. A screenshot of a desktop is a
        # screenshot of whoever's desktop it is: their account name, their drives, their
        # Dock full of what they happen to have installed. A runner has none of that, so
        # the picture shows the system and nothing else.
        #
        # The size is asked for rather than taken from the runner, whose screen is whatever
        # it happens to be and is not a size anybody chose.
        #
        # Drawn from the desktop directly rather than through the kernel. The kernel starts
        # the session in a process of its own, so a setting given to the kernel is not one
        # the session was ever told. Booting it is the step above; this one wants a picture.
        run: |
          java --enable-preview --enable-native-access=ALL-UNNAMED \
               -Dorg.fractalmicro.images="$PWD/build/frameworks" \
               -Dorg.fractalmicro.screen=1440x900 \
               -cp build/FractalJDE.jar org.fractalmicro.Main \
               --open-app org.fractalmicro.systemprofiler \
               --screenshot "$PWD/build/desktop.png"
          test -s build/desktop.png

      - name: Draw the boot screen
        shell: bash
        # It draws itself into a file, because it is a full screen window over everything
        # and a runner has no screen to put one on. This is the whole of what a person sees
        # while a machine starts, so it is worth having a copy of every build's.
        #
        # After the release and not before it, because building one starts by emptying
        # build/, and a picture drawn into that directory earlier is a picture that was
        # deleted before anything could keep it.
        run: |
          ./build/Fractal.exe --draw "$PWD/boot-screen.bmp" --size 1440x900
          test -s boot-screen.bmp
          ./build/Fractal.exe --where "$PWD/launcher.txt"
          cat launcher.txt
          # It has to have found both, or the launcher would have put up a message box
          # about it on a machine with nobody there to read one.
          grep -q "FractalJDE.jar" launcher.txt
          if grep -qE "^(jar|java) +not found" launcher.txt; then
              echo "the launcher could not find what it needs"
              exit 1
          fi

      - name: Keep what the checks said
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            selftest.txt
            release.txt
            boot.txt
            build/fresh-desktop.png
            build/desktop.png
            boot-screen.bmp
            launcher.txt

      - name: Keep the release
        uses: actions/upload-artifact@v4
        with:
          name: FractalJDE
          path: build/FractalJDE-*.zip
